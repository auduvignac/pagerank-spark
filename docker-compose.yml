services:
  spark-master:
    image: ghcr.io/auduvignac/pagerank-spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    restart: unless-stopped

  spark-worker:
    image: ghcr.io/auduvignac/pagerank-spark:latest
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/app
    depends_on:
      - spark-master
    restart: unless-stopped

  spark-submit:
    image: ghcr.io/auduvignac/pagerank-spark:latest
    container_name: spark-submit
    command: ["tail", "-f", "/dev/null"]
    environment:
      - SPARK_MODE=submit
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - spark-master
    restart: unless-stopped