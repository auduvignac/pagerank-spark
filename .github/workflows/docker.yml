name: Build and Publish Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push
        run: |
          docker build -f Dockerfile.custom -t ghcr.io/${{ github.actor }}/pagerank-spark:latest .
          docker push ghcr.io/${{ github.actor }}/pagerank-spark:latest